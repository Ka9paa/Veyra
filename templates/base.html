<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a12"><title>{% block title %}Veyra{% endblock %}</title>{% include 'social_meta_snippet.html' %}<link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}"></head><body>{% block body %}{% endblock %}<div id="toast" class="toast"></div>
<button class="v27-support-fab" id="supportFab" aria-label="Open Veyra Support"><span>✦</span><i></i></button>
<aside class="v27-support-panel hidden" id="supportPanel"><header><div><span class="v27-support-orb">✦</span><div><b>Veyra Support</b><small><i></i> Beta assistant</small></div></div><button id="supportClose">×</button></header><div class="v27-support-messages" id="supportMessages"><div class="support-ai"><b>Veyra Support</b><p>Need help? Ask about your account, credits, purchasing, exports, deployment, or a bug you found.</p></div></div><div class="v27-support-chips"><button data-support="How do I purchase Veyra Pro?">Purchase</button><button data-support="My project is not working">Bug help</button><button data-support="How do I export my project?">Export</button></div><form id="supportForm"><textarea id="supportInput" placeholder="Describe what you need help with…"></textarea><button>→</button></form><footer><a href="/support">Open Support Center</a><span>Veyra Public Beta</span></footer></aside>
<script src="{{ url_for('static',filename='app.js') }}"></script></body></html>
