<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="{% block meta_description %}Veyra is an AI software builder for turning ideas into real projects you can preview, refine, save, export, and ship.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Veyra">
  <meta property="og:title" content="{% block og_title %}Veyra — Build software from an idea{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Build, preview, refine, save, export, and ship real products with Veyra.{% endblock %}">
  <meta property="og:url" content="{{ request.url_root.rstrip('/') }}">
  <meta property="og:image" content="{{ url_for('static', filename='veyra-social-preview.gif', _external=True) }}">
  <meta property="og:image:secure_url" content="{{ url_for('static', filename='veyra-social-preview.gif', _external=True) }}">
  <meta property="og:image:type" content="image/gif">
  <meta property="og:image:width" content="640">
  <meta property="og:image:height" content="336">
  <meta property="og:image:alt" content="Veyra AI software builder showcase">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}Veyra — Build software from an idea{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}Build, preview, refine, save, export, and ship real products with Veyra.{% endblock %}">
  <meta name="twitter:image" content="{{ url_for('static', filename='veyra-social-preview.gif', _external=True) }}">

  <meta name="theme-color" content="#050812">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static',filename='favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static',filename='favicon-64.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static',filename='apple-touch-icon.png') }}">
  <title>{% block title %}Veyra{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}">
</head>
<body>
  {% block body %}{% endblock %}
  <div id="toast" class="toast"></div>

  <button class="vx-support-fab" id="supportFab" aria-label="Open Veyra Support">
    <img src="{{url_for('static',filename='veyra-mark.png')}}" alt="">
    <span></span>
  </button>

  <aside class="v27-support-panel hidden" id="supportPanel">
    <header>
      <div><span class="v27-support-orb">✦</span><div><b>Veyra Support</b><small><i></i> Beta assistant</small></div></div>
      <button id="supportClose">×</button>
    </header>
    <div class="v27-support-messages" id="supportMessages">
      <div class="support-ai"><b>Veyra Support</b><p>Ask about your account, credits, projects, exports, deployment, or a bug you found.</p></div>
    </div>
    <div class="v27-support-chips">
      <button data-support="How do credits work?">Credits</button>
      <button data-support="My project is not working">Bug help</button>
      <button data-support="How do I export my project?">Export</button>
    </div>
    <form id="supportForm"><textarea id="supportInput" placeholder="Describe what you need help with…"></textarea><button>→</button></form>
    <footer><a href="/support">Support center</a><span>Veyra Public Beta</span></footer>
  </aside>

  <script src="{{ url_for('static',filename='app.js') }}"></script>
  <script>
    (() => {
      const root=document.documentElement;
      window.addEventListener('pointermove',e=>{
        root.style.setProperty('--vx-mx',e.clientX+'px');
        root.style.setProperty('--vx-my',e.clientY+'px');
      },{passive:true});
      document.querySelectorAll('[data-vx-menu]').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const nav=document.querySelector('.vx-mobile-menu');
          if(nav) nav.classList.toggle('open');
        });
      });
    })();
  </script>
</body>
</html>
